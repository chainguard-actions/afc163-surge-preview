name: 'build-test'
on: # rebuild any PRs and main branch changes
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - 'releases/*'
      - test
      - v1

permissions:
  contents: read

jobs:
  build: # make sure build/ci work properly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: |
          npm install
      - run: |
          npm run all
