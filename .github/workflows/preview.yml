name: 'preview'
on: # rebuild any PRs and main branch changes
  pull_request:
    # use default types + closed event type
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview: # make sure the action works on a clean machine without building
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./
        id: preview_step
        name: test afc163/surge-preview
        with:
          surge_token: ${{ secrets.SURGE_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          teardown: 'true'
          dist: public/preview
          build: |
            mkdir -p public/preview
            npm install
            npm run build-preview -- public/preview
      - name: Get the output url
        env:
          PREVIEW_URL: ${{ steps.preview_step.outputs.preview_url }}
        run: echo "url => $PREVIEW_URL"
  preview2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./
        id: preview_action
        name: test afc163/surge-preview
        with:
          # test the default 'github_token' value here
          surge_token: ${{ secrets.SURGE_TOKEN }}
          teardown: 'true'
          dist: public/preview2
          build: |
            mkdir -p public/preview2
            npm install
            npm run build-preview -- public/preview2
      - name: Get the output url
        env:
          PREVIEW_URL: ${{ steps.preview_action.outputs.preview_url }}
        run: echo "url => $PREVIEW_URL"
