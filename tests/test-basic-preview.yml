name: Test basic PR preview
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          surge_token: fake-surge-token-for-testing
          github_token: fake-github-token-for-testing
          dist: public
          build: |
            echo "Skipping build"
      - name: Assert action ran (output or error expected)
        env:
          PREVIEW_URL: ${{ steps.action.outputs.preview_url }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "preview_url: $PREVIEW_URL"
          # The action is expected to fail with fake tokens, but it must have run
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"
