name: Test basic surge preview with failOnError false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal dist folder
        run: |
          mkdir -p public
          echo "<html><body>Test</body></html>" > public/index.html

      - id: action
        uses: .
        with:
          surge_token: fake-surge-token-for-testing
          github_token: fake-github-token-for-testing
          dist: public
          build: 'echo "skip build"'
          failOnError: 'false'
        continue-on-error: true

      - name: Assert preview_url output exists or action ran
        env:
          PREVIEW_URL: ${{ steps.action.outputs.preview_url }}
        run: |
          echo "preview_url: $PREVIEW_URL"
          echo "Action completed (with or without error due to fake tokens)"
          echo "PASS: action ran with surge_token and failOnError inputs covered"
