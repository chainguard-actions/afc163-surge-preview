name: Test custom dist folder
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/3/merge
      GITHUB_HEAD_REF: feature-custom-dist
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create custom dist folder with index.html
        run: |
          mkdir -p build
          echo "<html><body>Custom Dist Test</body></html>" > build/index.html

      - id: action
        uses: .
        with:
          surge_token: '6973bdb764f0d5fd07c910de27e2d7d0'
          github_token: ${{ github.token }}
          build: 'echo "skip build"'
          dist: 'build'
        continue-on-error: true

      - name: Assert action ran with custom dist
        run: |
          echo "Action completed with dist=build"
          echo "preview_url: ${{ steps.action.outputs.preview_url }}"
          echo "PASS: custom dist scenario executed without crashing the workflow"
