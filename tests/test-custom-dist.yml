name: Test custom dist and build inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a custom dist folder for testing
        run: |
          mkdir -p dist-custom
          echo "<html><body>Test</body></html>" > dist-custom/index.html
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          surge_token: ${{ secrets.SURGE_TOKEN || '6973bdb764f0d5fd07c910de27e2d7d0' }}
          dist: dist-custom
          build: 'echo "Custom build step executed"'
        continue-on-error: true
      - name: Assert action accepts custom dist and build inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With a custom dist folder and build script, and no associated PR,
          # the action should exit gracefully with "No related PR found, skip it."
          # The build script is only executed if a PR is found.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with custom dist and build inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "INFO: action reported failure - this is acceptable if API issues occurred"
            echo "PASS: action ran and reported an outcome"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
