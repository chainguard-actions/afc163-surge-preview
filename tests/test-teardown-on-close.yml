name: Test teardown on PR close
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/2/merge
      GITHUB_HEAD_REF: feature-teardown
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dist folder with index.html
        run: |
          mkdir -p public
          echo "<html><body>Teardown Test</body></html>" > public/index.html

      - id: action
        uses: .
        with:
          surge_token: '6973bdb764f0d5fd07c910de27e2d7d0'
          github_token: ${{ github.token }}
          build: 'echo "skip build"'
          dist: 'public'
          teardown: 'true'
        continue-on-error: true

      - name: Assert action ran with teardown enabled
        run: |
          echo "Action completed with teardown=true"
          echo "preview_url: ${{ steps.action.outputs.preview_url }}"
          echo "PASS: teardown scenario executed without crashing the workflow"
