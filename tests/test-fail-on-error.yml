name: Test failOnError input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/pull/2/merge
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: test-feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal dist folder
        run: mkdir -p public && echo "<h1>Test failOnError</h1>" > public/index.html
      - id: action
        uses: .
        with:
          surge_token: fake-surge-token-for-testing
          github_token: fake-github-token-for-testing
          dist: public
          build: 'echo "skip build"'
          failOnError: 'false'
        continue-on-error: true
      - name: Assert action ran with failOnError input
        run: |
          echo "Action completed with failOnError=false"
          echo "preview_url: ${{ steps.action.outputs.preview_url }}"
          echo "PASS: action was invoked with surge_token and failOnError inputs"
