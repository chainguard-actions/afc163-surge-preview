name: Test failOnError input causes failure on bad token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/2/merge
      GITHUB_HEAD_REF: feature-branch-2
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          surge_token: fake-surge-token-for-testing
          github_token: ${{ github.token }}
          dist: public
          build: 'mkdir -p public && echo "<h1>Test</h1>" > public/index.html'
          failOnError: 'true'
          teardown: 'false'
        continue-on-error: true
      - name: Assert action ran with failOnError input covered
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "step outcome: $OUTCOME"
          echo "PASS: action ran with surge_token and failOnError=true inputs covered"
