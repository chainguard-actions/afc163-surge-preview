name: Test failOnError input - no PR found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          surge_token: ${{ secrets.SURGE_TOKEN || '6973bdb764f0d5fd07c910de27e2d7d0' }}
          dist: public
          failOnError: 'true'
        continue-on-error: true
      - name: Assert failOnError mode exits gracefully when no PR found
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With failOnError=true and no associated PR, the action should still
          # exit gracefully with "No related PR found, skip it."
          # failOnError only affects deployment errors, not the no-PR early return.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with failOnError=true (no PR found, skipped gracefully)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "INFO: action reported failure - this is acceptable if API issues occurred"
            echo "PASS: action ran and reported an outcome"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
