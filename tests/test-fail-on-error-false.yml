name: Test failOnError false (default) - action does not fail workflow
on:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
  checks: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal dist folder
      - name: Create minimal dist folder
        run: |
          mkdir -p public
          echo "<html><body>FailOnError Test</body></html>" > public/index.html

      # Run with failOnError not set (defaults to false behavior).
      # The action is a PR preview tool; under workflow_dispatch it may find no PR
      # (graceful exit) or find a PR and attempt a surge deploy (which may fail).
      # In either case the workflow must continue — verified by the assertion below.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          surge_token: '6973bdb764f0d5fd07c910de27e2d7d0'
          dist: public
          build: 'echo "no build needed"'

      - name: Assert action step completed (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action step outcome: $OUTCOME"
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action step was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: workflow continued after action step (outcome=$OUTCOME)"
