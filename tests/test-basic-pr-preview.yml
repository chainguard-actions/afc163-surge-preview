name: Test basic PR preview with surge_token and failOnError
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          surge_token: fake-surge-token-for-testing
          github_token: ${{ github.token }}
          dist: public
          build: 'mkdir -p public && echo "<h1>Test</h1>" > public/index.html'
          failOnError: 'false'
          teardown: 'false'
        continue-on-error: true
      - name: Assert action ran and produced output
        env:
          PREVIEW_URL: ${{ steps.action.outputs.preview_url }}
        run: |
          echo "preview_url: $PREVIEW_URL"
          echo "PASS: action ran with surge_token and failOnError inputs covered"
