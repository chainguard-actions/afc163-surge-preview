name: Test teardown on PR close
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/2/merge
      GITHUB_HEAD_REF: feature-teardown
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal dist folder
        run: |
          mkdir -p public
          echo "<html><body>Teardown Test</body></html>" > public/index.html

      - id: action
        uses: .
        with:
          surge_token: '6973bdb764f0d5fd07c910de27e2d7d0'
          github_token: ${{ github.token }}
          build: 'echo "no build needed"'
          dist: 'public'
          teardown: 'true'
        continue-on-error: true

      - name: Assert teardown action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail due to missing real PR context or network,
          # but it should at least attempt to run (not be skipped).
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: teardown action ran with outcome=$OUTCOME"
