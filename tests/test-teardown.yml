name: Test teardown mode - no PR context
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test with teardown=true. Under workflow_dispatch with no associated PR,
      # the action should still exit gracefully with "No related PR found, skip it."
      # before reaching the teardown logic.
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          surge_token: ${{ secrets.SURGE_TOKEN || '6973bdb764f0d5fd07c910de27e2d7d0' }}
          dist: public
          build: 'echo "No build needed"'
          teardown: 'true'

      - name: Assert action completed without error in teardown mode
        env:
          PREVIEW_URL: ${{ steps.action.outputs.preview_url }}
        run: |
          echo "preview_url: '$PREVIEW_URL'"
          # Under workflow_dispatch with no associated PR, the action exits early
          # before teardown logic runs — preview_url is empty, which is expected
          echo "PASS: action completed gracefully in teardown mode with no PR context"
