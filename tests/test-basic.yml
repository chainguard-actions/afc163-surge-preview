name: Test basic usage - no PR found graceful exit
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run surge-preview action
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          surge_token: ${{ secrets.SURGE_TOKEN || '6973bdb764f0d5fd07c910de27e2d7d0' }}
          dist: public
        # Under workflow_dispatch with no associated PR, the action should exit
        # gracefully (no error) after logging "No related PR found, skip it."
        continue-on-error: true

      - name: Assert action completed without hard failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should either succeed (graceful skip) or fail gracefully.
          # It must NOT be 'cancelled' or produce an unexpected crash.
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action completed with outcome=$OUTCOME (graceful skip expected)"

      - name: Assert preview_url output is empty or unset when no PR found
        env:
          PREVIEW_URL: ${{ steps.action.outputs.preview_url }}
        run: |
          echo "preview_url: '$PREVIEW_URL'"
          # When no PR is found, the action returns early before setting preview_url.
          # So the output should be empty.
          if [ -n "$PREVIEW_URL" ]; then
            echo "INFO: preview_url was set to '$PREVIEW_URL' (PR may have been found via API search)"
          else
            echo "PASS: preview_url is empty as expected when no PR is associated"
          fi
