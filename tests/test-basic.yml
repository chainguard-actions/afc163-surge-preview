name: Test basic usage with surge_token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          surge_token: fake-surge-token-for-testing
          github_token: fake-github-token-for-testing
          build: 'echo "build step skipped"'
          dist: 'public'
          failOnError: 'false'
      - name: Assert action ran and produced output or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PREVIEW_URL: ${{ steps.action.outputs.preview_url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "preview_url: $PREVIEW_URL"
          # The action may fail due to fake tokens, but it should have run
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
