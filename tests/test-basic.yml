name: Test basic usage - no PR found graceful exit
on:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
  checks: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal dist folder so the action has something to deploy if it gets that far
      - name: Create minimal dist folder
        run: |
          mkdir -p public
          echo "<html><body>Test</body></html>" > public/index.html

      # The action is a PR preview tool. Under workflow_dispatch there may be no PR,
      # in which case it exits gracefully. If a PR IS found it attempts a surge deploy
      # which may fail (invalid token / network). Either way the workflow must not fail.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          surge_token: '6973bdb764f0d5fd07c910de27e2d7d0'
          dist: public
          build: 'echo "no build needed"'

      - name: Assert action step completed (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action step outcome: $OUTCOME"
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action step was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action step completed with outcome=$OUTCOME"

      - name: Assert preview_url output is a string (may be empty when no PR found)
        env:
          PREVIEW_URL: ${{ steps.action.outputs.preview_url }}
        run: |
          echo "preview_url: $PREVIEW_URL"
          # preview_url is empty when no PR was found (action exits early)
          # or a surge URL when a PR was found and deployment succeeded.
          # Both are valid outcomes for this scenario.
          echo "PASS: preview_url output is acceptable"
