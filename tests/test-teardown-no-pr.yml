name: Test teardown mode with no PR
on:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
  checks: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal dist folder
      - name: Create minimal dist folder
        run: |
          mkdir -p public
          echo "<html><body>Teardown Test</body></html>" > public/index.html

      # Run with teardown=true. Under workflow_dispatch the event action is not 'closed',
      # so teardown is skipped even if a PR is found. The action may find no PR (graceful
      # exit) or find a PR and attempt a surge deploy (which may fail).
      # continue-on-error ensures the workflow continues so we can assert on the outcome.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          surge_token: '6973bdb764f0d5fd07c910de27e2d7d0'
          dist: public
          build: 'echo "no build needed"'
          teardown: 'true'

      - name: Assert action step completed in teardown mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action step outcome: $OUTCOME"
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action step was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action completed in teardown mode (outcome=$OUTCOME)"
